<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page Blocked</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
            border-top: 5px solid var(--danger);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: var(--danger-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            color: var(--danger);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .message {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .details-box {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
        }

        .detail-item {
            display: flex;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-weight: 600;
            width: 90px;
            color: var(--text-main);
        }

        .detail-value {
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            word-break: break-all;
        }

        .category-badge {
            background-color: var(--danger-light);
            color: #b91c1c;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .developer {
            font-weight: 600;
            color: var(--text-main);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <!-- Alert Document SVG Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1>Web Page Blocked</h1>
        
        <p class="message">
            The web page you are trying to visit has been blocked in accordance with company policy. Please contact your system administrator if you believe this is an error.
        </p>

        <div class="details-box">
            <div class="detail-item">
                <span class="detail-label">User:</span>
                <span class="detail-value">10.5.186.157</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">URL:</span>
                <span class="detail-value">m7hta.com/</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Category:</span>
                <span class="detail-value category-badge">high-risk</span>
            </div>
        </div>
    </div>

    <div class="footer">
        Designed & Developed by <span class="developer">Chaitanya Mehta</span>
    </div>

</body>
</html>
