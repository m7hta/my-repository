<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANUSHKAA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0b0e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 10s ease-in-out infinite alternate;
    }

    .glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.3) 0%, rgba(0,0,0,0) 70%);
      bottom: -100px;
      right: -100px;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 12s ease-in-out infinite alternate-reverse;
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 60px 80px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      width: 700px;
      transition: transform 0.4s ease, border-color 0.4s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Badge */
    .tag {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.1);
      padding: 8px 20px;
      border-radius: 100px;
      border: 1px solid rgba(167, 139, 250, 0.2);
      margin-bottom: 24px;
    }

    /* Modern Typography Title */
    .title {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-shadow: 0 0 40px rgba(216, 180, 254, 0.2);
    }

    /* Subtitle */
    .subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.5px;
      max-width: 450px;
      margin: 0 auto 36px auto;
    }

    /* Modern CTA Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0b0b0e;
      background: #ffffff;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
    }

    .btn:hover {
      background: #f1f5f9;
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(255, 255, 255, 0.25);
    }

    /* Subtle Animations */
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }

    @media (max-width: 600px) {
      .card {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="card">
    <span class="tag">Portfolio & Showcase</span>
    <h1 class="title">ANUSHKAA</h1>
    <p class="subtitle">Crafting digital experiences with elegance, clarity, and modern design aesthetic.</p>
    <a href="#explore" class="btn">Explore Work &rarr;</a>
  </main>

</body>
</html>
